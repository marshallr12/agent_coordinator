# agentc-supervisor configuration for the Windows services: the role runner
# (`agentc-supervisor --config <this file> windows-service`), the supervisor
# (`... windows-service --role supervisor`) and the egress and publication
# brokers (`--role egress`, `--role publication`). Every entry has
# an in-code default; the commented lines show those defaults. Nothing here
# is installed by this repository: a service is installed only by an owner,
# from an elevated session.
[windows_service]
# The service's name in the Service Control Manager.
# name = "agentc-runner"
# Where the runner journals its launches. Created with an access list for the
# runner's account, the system and administrators only.
# state_dir = 'C:\ProgramData\agentc\runner'
# The pipe's name below \\.\pipe\
# pipe_name = "agentc-runner"
# The one account whose process may use the pipe, as SID text: the
# supervisor's service identity. It has no usable default. While it is empty
# the service refuses to start, so no pipe is ever served to nobody in
# particular.
# client_sid = ""
# Seconds a stop request gives launches to end by themselves.
# stop_grace_seconds = 30
# Seconds a preshutdown request gives launches to end by themselves.
# preshutdown_grace_seconds = 60
# The time the Service Control Manager gives the service to stop at
# preshutdown. It must exceed preshutdown_grace_seconds plus
# terminate_patience_seconds.
# preshutdown_timeout_seconds = 120
# Seconds termination may take after the grace before the service gives up
# waiting for Windows to confirm it.
# terminate_patience_seconds = 20
# Seconds between status reports while the service is stopping.
# status_interval_seconds = 3
# The egress broker's control pipe, below \\.\pipe\ (for example
# "agentc-egress-control"). Empty: no launch is offered brokered egress, and
# a launch still has no network at all. Set: every launch must be admitted
# by the broker before it starts; a launch the broker refuses, or whose
# broker is not running, is not started.
# egress_control_pipe = ""
# The egress broker's account, as SID text. Required with
# egress_control_pipe: the runner uses the control pipe only when this
# account owns it.
# egress_broker_sid = ""
# The publication broker's control pipe, below \\.\pipe\ (for example
# "agentc-publication-control"). Empty: no launch is offered brokered
# publication. Set: every implementer launch must be admitted by the broker
# before it starts, and is told its pipe in
# AGENT_COORDINATOR_CANDIDATE_PUSH_SOCKET; reviewer launches never are.
# publication_control_pipe = ""
# The publication broker's account, as SID text. Required with
# publication_control_pipe.
# publication_broker_sid = ""

[windows_supervisor]
# The service's name in the Service Control Manager.
# name = "agentc-supervisor"
# Where the loop keeps its launch records, its heartbeat and service.log.
# state_dir = 'C:\ProgramData\agentc\supervisor'
# The runner service's pipe, below \\.\pipe\
# runner_pipe = "agentc-runner"
# The runner service's account, as SID text. It has no usable default: a pipe
# that account does not own is never used, and while this is empty the
# service refuses to start.
# runner_sid = ""
# Seconds between status reports while the service is stopping.
# status_interval_seconds = 3
# The pipe the publication broker asks, before each push, whether a launch
# still has coordinator authority; below \\.\pipe\
# authority_pipe = "agentc-supervisor-authority"
# The publication broker's account, as SID text: the only client the
# authority pipe serves. Empty: the pipe is not served, so a broker that asks
# is refused every push.
# publication_broker_sid = ""

# The acceptance stand-in. It replaces the coordinator with a directory of
# queued items and a ledger, for machine acceptance only. While it is off,
# the supervisor claims nothing: no provider harness is supported on Windows.
[windows_supervisor.stand_in]
# enabled = false
# One file per queued item; the file's name is the item's task id.
# queue_dir = 'C:\ProgramData\agentc\stand-in\queue'
# Every claim, renewal, release and launch event, flushed before its effect.
# ledger = 'C:\ProgramData\agentc\stand-in\ledger.jsonl'
# The command every stand-in launch runs, as an argument vector. It has no
# default; the stand-in cannot be enabled without it.
# fixture = []
# An existing directory the runner's account can create launch directories in.
# launch_root = 'C:\ProgramData\agentc\runner\stand-in-launches'

# The egress broker (`... windows-service --role egress`). It forwards a
# launch's CONNECT requests to the hosts the Linux proxy allows
# (egress_allow and egress_allow_extra) on public addresses only. It refuses
# to start until runner_sid is set.
[windows_egress]
# The service's name in the Service Control Manager.
# name = "agentc-egress"
# The service's directory, holding service.log. Created with an access list
# for the broker's account, the system and administrators only.
# state_dir = 'C:\ProgramData\agentc\egress'
# The control pipe the runner admits launches through, below \\.\pipe\
# (the runner's windows_service.egress_control_pipe).
# control_pipe = "agentc-egress-control"
# The runner service's account, as SID text: the only client the control
# pipe serves. No usable default.
# runner_sid = ""

# The publication broker (`... windows-service --role publication`). It
# publishes an implementer launch's candidate to that launch's own ref on
# one remote. It refuses to start until runner_sid, remote and
# supervisor_sid are set.
[windows_publication]
# The service's name in the Service Control Manager.
# name = "agentc-publication"
# The service's directory, holding service.log and, below work\, each
# launch's private repository. Created with an access list for the broker's
# account, the system and administrators only.
# state_dir = 'C:\ProgramData\agentc\publication'
# The control pipe the runner admits implementer launches through, below
# \\.\pipe\ (the runner's windows_service.publication_control_pipe).
# control_pipe = "agentc-publication-control"
# The runner service's account, as SID text. No usable default.
# runner_sid = ""
# The one remote candidates are published to. No usable default.
# remote = ""
# The supervisor's authority pipe, asked before each push, below \\.\pipe\
# authority_pipe = "agentc-supervisor-authority"
# The supervisor service's account, as SID text: the authority pipe is asked
# only when this account owns it. No usable default.
# supervisor_sid = ""
