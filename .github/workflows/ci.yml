name: Coordination checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordination-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux format, Clippy, and workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust and quality tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Build service and native CLI
        run: cargo build --workspace --locked
      - name: Exercise two independent CLI harnesses against the service
        run: python3 scripts/smoke.py
      - name: Exercise live backup and reconciled fresh-directory restore
        run: python3 scripts/backup_smoke.py

  windows-client:
    name: Native Windows client, CLI, and local runner tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      # This is a native Windows run, not a Linux cross-compilation check.
      # Windows validation remains pending until this job actually passes.
      - name: Run client, CLI, and local runner tests
        run: cargo test -p coordinator-client -p coordinator-cli -p coordinator-local --locked --no-fail-fast

  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install the pinned auditor with its published lockfile
        run: cargo install cargo-audit --version 0.22.2 --locked
      # cargo-audit reads the committed lockfile; it does not support --locked.
      - name: Audit the committed dependency lockfile
        run: cargo audit --file Cargo.lock
