[package]
name = "agentc-integrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "agentc-integrator"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc"] }
base64 = "0.23"
chrono.workspace = true
clap.workspace = true
coordinator-client = { path = "../client" }
coordinator-local = { path = "../local" }
reqwest.workspace = true
rustls-pki-types = { version = "1.15", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
toml = "0.9"
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
